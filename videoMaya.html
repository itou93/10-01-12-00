<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>越総 ARアプリ</title>

    <!-- アイコン・ライブラリ読込 -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@master/aframe/build/aframe-ar.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>

    <!-- 外部CSSファイルの読み込み -->
    <link rel="stylesheet" href="Style.css">
</head>

<body>
    <a href="index.html" class="btn-back">← 戻る</a>
    <button class="btn-collection" onclick="openCollection()">🎬 解放動画</button>

    <!--  学科選択モーダル -->
    <div id="collection-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 onclick="handleTitleClick()"> 学科を選択してください</h2>
           <!-- ここに追加：学科ボタンのグループ -->
    <div class="dept-button-group">
      <button class="dept-btn" onclick="selectDepartment('stamp-a')">電子機械科</button>
      <button class="dept-btn" onclick="selectDepartment('stamp-b')">情報技術科</button>
      <button class="dept-btn" onclick="selectDepartment('stamp-c')">情報処理科</button>
      <button class="dept-btn" onclick="selectDepartment('stamp-d')">服飾デザイン科</button>
      <button class="dept-btn" onclick="selectDepartment('stamp-e')">食物調理科</button>
      <button class="dept-btn" onclick="selectDepartment('stamp-f')">流通経済科</button>
    </div>

        <!--ここに追加：学科を選択後に動画リストが動的に読み込まれるエリア -->
            <div id="collection-list"></div>

                <!-- 閉じるボタン -->
                <button class="modal-btn close-btn" onclick="closeCollection()">閉じる</button>
            </div>
        </div>
    </div>

    <!-- 2. 学科別の動画モーダル -->
    <div id="dept-video-modal" class="modal-overlay">
        <div class="modal-content">
            <h2 id="dept-title">学科動画一覧</h2>
            <div id="dept-video-list"></div>
            <div class="modal-footer">
                <button class="modal-btn close-btn" onclick="closeDeptVideos()">← 学科一覧へ戻る</button>
            </div>
        </div>
    </div>

    <!-- スタート説明画面 -->
    <div id="explanation-screen">
        <div class="bg-decorations">
            <i class="fa-solid fa-gear decor-item item-1"></i>
            <i class="fa-solid fa-calculator decor-item item-2"></i>
            <i class="fa-solid fa-scissors decor-item item-3"></i>
            <i class="fa-solid fa-utensils decor-item item-4"></i>
            <i class="fa-solid fa-vr-cardboard decor-item item-5"></i>
            <i class="fa-solid fa-graduation-cap decor-item item-6"></i>
        </div>

        <div class="card">
            <h1>— 越総 AR体験 —</h1>
            <p>
                カメラを校章マーカーに<br>
                かざしてみよう！<br>
                キャラクターと学科紹介動画が<br>
                飛び出すよ 
            </p>

            <div>
                <button class="start-btn" onclick="startAR()">Next ➔</button>
            </div>
        </div>
    </div>

    <!-- ARシーン -->
    <a-scene embedded vr-mode-ui="enabled: false;" arjs="sourceType: webcam; debugUIEnabled: false; patternRatio: 0.7;">
        <a-entity light="type: ambient; color: #ffffff; intensity: 1.8;"></a-entity>
        <a-entity light="type: directional; color: #ffffff; intensity: 1.2;" position="1 4 2"></a-entity>

        <a-assets>
            <video id="schoolShortVideo" src="jgvideo2.mp4" loop playsinline webkit-playsinline preload="auto" crossorigin="anonymous"></video>
            <video id="gameVideo" src="GameVideo.mp4" loop playsinline webkit-playsinline preload="auto" crossorigin="anonymous"></video>
        </a-assets>

        <a-marker type="pattern" url="./pattern-koshou.patt" patternRatio="0.7" id="ar-marker-1">
            <a-video src="#schoolShortVideo" position="0 0.1 0" rotation="-90 0 0" width="3.2" height="1.8"></a-video>
            <a-entity gltf-model="kougyo2.glb" high-quality-texture position="-1 0.5 -0.3" rotation="-90 0 0" scale="0.1 0.1 0.1" animation-mixer="clip: *; loop: pingpong" animation="loop: true"></a-entity>
        </a-marker>

        <a-marker type="pattern" url="./pattern-JGmaeker.patt" patternRatio="0.7" id="ar-marker-2">
            <a-video src="#gameVideo" position="0 0.1 0" rotation="-90 0 0" width="3.2" height="1.8"></a-video>
            <a-entity gltf-model="syokutyou.glb" high-quality-texture position="-1 0.3 -0.2" rotation="55 180 0" scale="6 6 6" animation-mixer="clip: *; loop: repeat"></a-entity>
        </a-marker>

        <a-marker type="pattern" url="./pattern-j.patt" patternRatio="0.7" id="ar-marker-3">
            <a-video src="#schoolShortVideo" position="0 0.1 0" rotation="-90 0 0" width="3.2" height="1.8"></a-video>
            <a-entity gltf-model="syougyou3.glb" high-quality-texture position="-1 0.5 -0.3" rotation="-90 0 0" scale="0.1 0.1 0.1" animation-mixer="clip: *; loop: repeat" animation="property: position; to: 1 0.5 -0.3; dir: alternate; dur: 5000; loop: true"></a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <!-- マップ移動案内ポップアップ -->
    <div id="stamp-dialog">
        <div class="stamp-dialog-box">
            <h3 style="margin-top: 0; color: #059669; font-size: 20px;">🎉 スタンプ獲得チャンス！</h3>
            <p style="font-size: 14px; color: #444; line-height: 1.6; margin-bottom: 20px;">
                スポットを検出しました！<br>マップを開いてスタンプを押しますか？
            </p>
            <div style="display: flex; gap: 10px;">
                <button onclick="closeStampDialog()" style="flex: 1; padding: 10px; border: none; background: #94a3b8; color: white; border-radius: 10px; font-weight: bold; cursor: pointer;">まだ見にいく</button>
                <button onclick="goToMap()" style="flex: 1; padding: 10px; border: none; background: #f59e0b; color: white; border-radius: 10px; font-weight: bold; cursor: pointer;">マップへGO!</button>
            </div>
        </div>
    </div>

    <!-- 外部JavaScriptファイルの読み込み -->
    <script src="Script.js"></script>
</body>
</html>
